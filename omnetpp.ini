# =============================================================
#  omnetpp.ini  –  Slotted ALOHA Simulation  (12 kịch bản)
#
#  Thông số gốc:
#    N = 20 trạm  |  L = 960 bit  |  R = 9600 bps  |  T = L/R = 0.1 s
#    iaTime_optimal = 2s → G_optimal = 1.0  (S_max = 1/e ≈ 0.368)
#
#  QUAN TRỌNG: iaTime trong ini là HẰNG SỐ (mean cố định).
#    Sự ngẫu nhiên nằm trong C++: exponential(iaTime)
#    KHÔNG dùng exponential() trong ini → sẽ gây hyper-exponential bug!
#
#  Thiết kế thực nghiệm:
#    Phase 1  (3 kịch bản): vary iaTime → tìm G tối ưu
#    Phase 2a (3 kịch bản): fix iaTime=2s, vary pkLenBits → ảnh hưởng của L
#    Phase 2b (3 kịch bản): fix iaTime=2s, vary numHosts  → ảnh hưởng của N
#    Phase 3  (3 kịch bản): fix iaTime=2s, vary txRate    → ảnh hưởng của R
# =============================================================

[General]
network        = slottedaloha.SlottedAlohaNetwork
sim-time-limit = 3600s

record-eventlog       = false
record-vector-results = false
**.vector-recording   = false
record-scalar-results = true
result-dir            = results

# --- Giá trị mặc định (baseline) ---
*.numHosts  = 20
*.pkLenBits = 960bit
*.txRate    = 9600bps

# =============================================================
#  PHASE 1 – Vary iaTime (tần suất gửi gói)
#  Fixed: N=20, L=960bit, R=9600bps → T=0.1s
#  G = 20 × (0.1 / iaTime)
# =============================================================

[Config LightLoad]
description = "Phase1 | vary-iaTime | iaTime=20s  | G=0.1"
*.host[*].iaTime = 20s

[Config MediumLoad]
description = "Phase1 | vary-iaTime | iaTime=2s   | G=1.0"
*.host[*].iaTime = 2s

[Config HighLoad]
description = "Phase1 | vary-iaTime | iaTime=0.5s | G=4.0"
*.host[*].iaTime = 0.5s

# =============================================================
#  PHASE 2a – Vary pkLenBits (kích thước gói)
#  Fixed: iaTime=2s, N=20, R=9600bps
#  T = L/R,  G = 20 × T / 2
# =============================================================

[Config SmallPacket]
description = "Phase2a | vary-L | L=480bit  (T=0.05s) | G=0.5"
*.pkLenBits      = 480bit
*.host[*].iaTime = 2s

[Config MediumPacket]
description = "Phase2a | vary-L | L=960bit  (T=0.1s)  | G=1.0"
*.pkLenBits      = 960bit
*.host[*].iaTime = 2s

[Config LargePacket]
description = "Phase2a | vary-L | L=1920bit (T=0.2s)  | G=2.0"
*.pkLenBits      = 1920bit
*.host[*].iaTime = 2s

# =============================================================
#  PHASE 2b – Vary numHosts (số lượng trạm)
#  Fixed: iaTime=2s, L=960bit, R=9600bps → T=0.1s
#  G = N × 0.1 / 2
# =============================================================

[Config FewHosts]
description = "Phase2b | vary-N | N=5  | G=0.25"
*.numHosts       = 5
*.host[*].iaTime = 2s

[Config MediumHosts]
description = "Phase2b | vary-N | N=20 | G=1.0"
*.numHosts       = 20
*.host[*].iaTime = 2s

[Config ManyHosts]
description = "Phase2b | vary-N | N=40 | G=2.0"
*.numHosts       = 40
*.host[*].iaTime = 2s

# =============================================================
#  PHASE 3 – Vary txRate (tốc độ kênh / băng thông)
#  Fixed: iaTime=2s, N=20, L=960bit
#  T = 960/R,  G = 20 × T / 2
# =============================================================

[Config SlowChannel]
description = "Phase3 | vary-R | R=4800bps  (T=0.2s)  | G=2.0"
*.txRate         = 4800bps
*.host[*].iaTime = 2s

[Config BaseChannel]
description = "Phase3 | vary-R | R=9600bps  (T=0.1s)  | G=1.0"
*.txRate         = 9600bps
*.host[*].iaTime = 2s

[Config FastChannel]
description = "Phase3 | vary-R | R=19200bps (T=0.05s) | G=0.5"
*.txRate         = 19200bps
*.host[*].iaTime = 2s
