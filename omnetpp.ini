# =============================================================
#  omnetpp.ini  –  Slotted ALOHA Simulation  (4 Phase Sweep)
#
#  Thông số gốc (baseline):
#    N = 20 trạm  |  L = 960 bit  |  R = 9600 bps  |  T = L/R = 0.1 s
#    iaTime_optimal = 2s → G_optimal = 1.0  (S_max = 1/e ≈ 0.368)
#
#  MÔ HÌNH POISSON:
#    - iaTime trong ini là HẰNG SỐ (mean cố định).
#    - Sự ngẫu nhiên nằm trong C++ Host.cc: exponential(iaTime_mean)
#    - KHÔNG dùng exponential() trong ini → sẽ gây hyper-exponential bug!
#
#  TỌA ĐỘ KHÔNG GIAN:
#    - Host: phân bố ngẫu nhiên đều trên 1000×1000 m  (uniform)
#    - Server: đặt tại trung tâm (500, 500)
#    - z: độ cao ngẫu nhiên 0–50 m (metadata, không ảnh hưởng canvas 2D)
#
#  THIẾT KẾ THỰC NGHIỆM (Sweep tham số):
#    Phase 1  (1 config, 10 runs): sweep iaTime  → quét G từ 0.1 đến 8.0
#    Phase 2a (1 config, 10 runs): sweep L       → quét G từ 0.25 đến 6.0
#    Phase 2b (1 config, 10 runs): sweep N       → quét G từ 0.1 đến 5.0
#    Phase 3  (1 config, 10 runs): sweep R       → quét G từ 0.1 đến 5.0
#    Tổng: 4 configs × 10 giá trị = 40 runs
# =============================================================

[General]
network        = slottedaloha.SlottedAloha
sim-time-limit = 3600s

record-eventlog       = false
record-vector-results = false
**.vector-recording   = false
record-scalar-results = true
result-dir            = results

# --- Giá trị mặc định (baseline) ---
*.numHosts  = 20
*.pkLenBits = 960bit
*.txRate    = 9600bps

# --- Tọa độ ngẫu nhiên các Host trên mặt phẳng 1000×1000 m ---
**.host[*].x = uniform(0m, 1000m)
**.host[*].y = uniform(0m, 1000m)
**.host[*].z = uniform(0m, 50m)

# --- Tọa độ Server cố định tại trung tâm ---
**.server.x = 500m
**.server.y = 500m

# --- Tham số hoạt ảnh Qtenv ---
**.idleAnimationSpeed               = 1
**.transmissionEdgeAnimationSpeed   = 1e-6
**.midTransmissionAnimationSpeed    = 1e-1
**.animationHoldTimeOnCollision     = 0s

# =============================================================
#  PHASE 1 – Sweep iaTime (tần suất gửi gói)
#  Fixed: N=20, L=960bit, R=9600bps → T=0.1s
#  G = N × (T / iaTime) = 2 / iaTime
#
#  iaTime   →  G:    0.25→8.0  0.4→5.0  0.5→4.0  0.667→3.0
#                     1→2.0  1.333→1.5  2→1.0  4→0.5  10→0.2  20→0.1
# =============================================================

[Config Phase1_VaryIaTime]
description = "Phase1 | sweep iaTime | N=20 L=960b R=9600bps"
*.host[*].iaTime = ${ia=0.25, 0.4, 0.5, 0.667, 1, 1.333, 2, 4, 10, 20}s

# =============================================================
#  PHASE 2a – Sweep pkLenBits (kích thước gói)
#  Fixed: iaTime=2s, N=20, R=9600bps
#  T = L/R  →  G = N × T / iaTime = L / 960
#
#  L (bit)  →  G:    240→0.25  480→0.5  640→0.667  960→1.0
#                     1440→1.5  1920→2.0  2880→3.0  3840→4.0
#                     4800→5.0  5760→6.0
# =============================================================

[Config Phase2a_VaryPktLen]
description = "Phase2a | sweep L | iaTime=2s N=20 R=9600bps"
*.host[*].iaTime = 2s
*.pkLenBits = ${L=240, 480, 640, 960, 1440, 1920, 2880, 3840, 4800, 5760}bit

# =============================================================
#  PHASE 2b – Sweep numHosts (số lượng trạm)
#  Fixed: iaTime=2s, L=960bit, R=9600bps → T=0.1s
#  G = N × T / iaTime = N / 20
#
#  N        →  G:    2→0.1  5→0.25  10→0.5  15→0.75  20→1.0
#                     30→1.5  40→2.0  60→3.0  80→4.0  100→5.0
# =============================================================

[Config Phase2b_VaryNumHosts]
description = "Phase2b | sweep N | iaTime=2s L=960b R=9600bps"
*.host[*].iaTime = 2s
*.numHosts = ${N=2, 5, 10, 15, 20, 30, 40, 60, 80, 100}

# =============================================================
#  PHASE 3 – Sweep txRate (tốc độ kênh / băng thông)
#  Fixed: iaTime=2s, N=20, L=960bit
#  T = L/R = 960/R  →  G = N × T / iaTime = 9600 / R
#
#  R (bps)  →  G:    1920→5.0  2400→4.0  3200→3.0  4800→2.0
#                     6400→1.5  9600→1.0  14400→0.667  19200→0.5
#                     38400→0.25  48000→0.2
# =============================================================

[Config Phase3_VaryTxRate]
description = "Phase3 | sweep R | iaTime=2s N=20 L=960b"
*.host[*].iaTime = 2s
*.txRate = ${R=1920, 2400, 3200, 4800, 6400, 9600, 14400, 19200, 38400, 48000}bps
